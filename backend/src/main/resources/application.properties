spring.application.name=godard-stack
spring.main.banner-mode=off
server.address=127.0.0.1
server.port=0
server.shutdown=graceful
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=1
spring.lifecycle.timeout-per-shutdown-phase=10s

godard.data-dir=${GODARD_DATA_DIR}
godard.session-token=${GODARD_SESSION_TOKEN}
godard.ready-file=${GODARD_READY_FILE}

spring.datasource.url=jdbc:sqlite:${godard.data-dir}/data/godard-stack.db?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000


