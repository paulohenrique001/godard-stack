services:
  godard-stack:
    build:
      target: dev
    image: godard-stack:dev
    stop_signal: SIGKILL
    restart: on-failure
    ports: !override
      - 127.0.0.1:${APP_PORT:-9373}:5173
    volumes:
      - backend-data-dev:/data
      - maven-cache:/root/.m2
    develop:
      watch:
        - path: ./backend/src
          target: /app/backend/src
          action: sync+exec
          exec:
            command: touch /tmp/backend-restart
        - path: ./backend/pom.xml
          action: rebuild
        - path: ./frontend/src
          target: /app/frontend/src
          action: sync
        - path: ./frontend/index.html
          target: /app/frontend/index.html
          action: sync
        - path: ./frontend/vite.config.ts
          target: /app/frontend/vite.config.ts
          action: sync
        - path: ./frontend/package-lock.json
          action: rebuild

volumes:
  backend-data-dev:
  maven-cache:
